name: Update data.json from web

on:
  repository_dispatch:
    types: [update-data]

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install jsondiffpatch
        run: npm install jsondiffpatch

      - name: Write payload to file
        run: |
          cat > payload.json << 'EOF'
          ${{ toJSON(github.event.client_payload) }}
          EOF

      - name: Apply changes
        run: |
          node -e '
            const fs = require("fs");
            const jsondiffpatch = require("jsondiffpatch");

            console.log("=== Starting apply changes ===");

            // Read current data.json (or start empty)
            let currentData = {};
            try {
              const content = fs.readFileSync("data.json", "utf8");
              currentData = JSON.parse(content);
              console.log("Current data loaded, scenarios:", currentData.scenarios?.length || 0);
            } catch (e) {
              console.log("No existing data.json, starting fresh");
            }

            // Read the payload
            const payload = JSON.parse(fs.readFileSync("payload.json", "utf8"));
            console.log("Payload type:", payload.type);

            // Handle Gist payload (if still used)
            if (payload.type === "gist" && payload.gist_id) {
              console.log("Fetching diff from Gist:", payload.gist_id);
              const token = process.env.GITHUB_TOKEN;
              if (!token) {
                console.error("GITHUB_TOKEN not set");
                process.exit(1);
              }
              const gistUrl = "https://api.github.com/gists/" + payload.gist_id;
              fetch(gistUrl, {
                headers: { "Authorization": "token " + token, "Accept": "application/vnd.github.v3+json" }
              })
              .then(res => res.json())
              .then(gistData => {
                const files = gistData.files;
                const fileName = Object.keys(files)[0];
                const diffData = JSON.parse(files[fileName].content);
                applyDiff(diffData);
                // Delete the gist after applying
                return fetch(gistUrl, { method: "DELETE", headers: { "Authorization": "token " + token } });
              })
              .catch(e => {
                console.error("Gist processing failed:", e.message);
                process.exit(1);
              });
              return;
            }

            // Direct diff or full data
            if (payload.type === "diff" && payload.data) {
              const diffData = JSON.parse(payload.data);
              applyDiff(diffData);
            } else if (payload.type === "full" && payload.data) {
              const newData = JSON.parse(payload.data);
              fs.writeFileSync("data.json", JSON.stringify(newData, null, 2));
              console.log("✅ Full data written");
            } else {
              console.log("⚠️ No valid data to apply");
            }

            function applyDiff(diff) {
              console.log("Applying diff...");
              try {
                const result = jsondiffpatch.patch(currentData, diff);
                fs.writeFileSync("data.json", JSON.stringify(result, null, 2));
                console.log("✅ Patch applied successfully");
              } catch (e) {
                console.error("Patch failed:", e.message);
                process.exit(1);
              }
            }
          '

      - name: Validate JSON
        run: |
          if [ -f data.json ] && [ -s data.json ]; then
            if ! jq empty data.json 2>/dev/null; then
              echo "❌ Invalid JSON in data.json"
              cat data.json | head -100
              exit 1
            fi
            echo "✅ JSON validation passed"
          else
            echo "⚠️ data.json missing or empty"
            exit 1
          fi

      - name: Commit and push
        run: |
          if [ -f data.json ] && git diff --quiet data.json; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Apply changes from web [skip ci]" || echo "No changes to commit"
            git push --no-verify origin HEAD:main || git push --force origin HEAD:main
          fi
