name: Update data.json from web

on:
  repository_dispatch:
    types: [update-data]

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Write payload to file
        run: |
          cat > payload.json << 'EOF'
          ${{ toJSON(github.event.client_payload) }}
          EOF

      - name: Apply changes
        run: |
          node -e "
            const fs = require('fs');
            
            console.log('=== Starting apply changes ===');
            
            // Read current data.json
            let currentData = {};
            try {
              const content = fs.readFileSync('data.json', 'utf8');
              currentData = JSON.parse(content);
              console.log('Current data loaded, scenarios:', currentData.scenarios?.length || 0);
              console.log('Current scenario IDs:', currentData.scenarios?.map(s => s.id).join(', '));
            } catch (e) {
              console.log('No existing data.json, creating new one');
            }
            
            // Read payload
            const payloadContent = fs.readFileSync('payload.json', 'utf8');
            console.log('Payload content length:', payloadContent.length);
            
            let payload;
            try {
              payload = JSON.parse(payloadContent);
              console.log('Payload parsed successfully');
              console.log('Payload keys:', Object.keys(payload));
            } catch (e) {
              console.error('Failed to parse payload.json:', e.message);
              process.exit(1);
            }
            
            let diffData = null;
            const payloadType = payload.type || 'diff';
            
            // ============================================================
            // FUNCTION: Recursively extract string from nested arrays
            // ============================================================
            function extractStringFromNestedArray(value) {
              if (!value) return null;
              if (typeof value === 'string') return value;
              if (typeof value === 'number') return String(value);
              if (Array.isArray(value)) {
                for (const item of value) {
                  const result = extractStringFromNestedArray(item);
                  if (result) return result;
                }
              }
              if (value && typeof value === 'object') {
                // If it's an object with an id or name, try to extract that
                if (value.id) {
                  const idResult = extractStringFromNestedArray(value.id);
                  if (idResult) return idResult;
                }
                if (value.name) {
                  const nameResult = extractStringFromNestedArray(value.name);
                  if (nameResult) return nameResult;
                }
                // Otherwise, look for any string property
                for (const key in value) {
                  const result = extractStringFromNestedArray(value[key]);
                  if (result) return result;
                }
              }
              return null;
            }
            
            // ============================================================
            // FUNCTION: Extract scenario data from diff object
            // ============================================================
            function extractScenarioFromDiff(diffObj) {
              if (!diffObj || typeof diffObj !== 'object') return null;
              
              let id = null;
              let name = null;
              let processes = [];
              
              // Extract id using recursive extraction
              if (diffObj.id) {
                id = extractStringFromNestedArray(diffObj.id);
              }
              
              // Extract name using recursive extraction
              if (diffObj.name) {
                name = extractStringFromNestedArray(diffObj.name);
              }
              
              // If we still don't have a name but have an id, try to find a name
              if (!name && id) {
                // Look for name in the object
                if (diffObj.name) {
                  name = extractStringFromNestedArray(diffObj.name);
                }
                // If still no name, use 'Scenario' as default
                if (!name) {
                  name = 'Scenario';
                }
              }
              
              // Extract processes
              if (diffObj.processes) {
                if (Array.isArray(diffObj.processes)) {
                  processes = diffObj.processes;
                } else if (typeof diffObj.processes === 'object') {
                  for (const key in diffObj.processes) {
                    if (key === '_t') continue;
                    const val = diffObj.processes[key];
                    if (Array.isArray(val) && val.length > 0) {
                      processes.push(val[0]);
                    } else if (val && typeof val === 'object' && val.id) {
                      processes.push(val);
                    }
                  }
                }
              }
              
              // Only return if we have an id or some processes
              if (id || processes.length > 0) {
                return { 
                  id: id || 'scenario_' + Date.now(), 
                  name: name || 'Unnamed Scenario', 
                  processes: processes 
                };
              }
              
              return null;
            }
            
            // ============================================================
            // FUNCTION: Merge a new scenario into existing scenarios
            // ============================================================
            function mergeScenarioIntoArray(existingScenarios, newScenario) {
              if (!Array.isArray(existingScenarios)) existingScenarios = [];
              if (!newScenario) return existingScenarios;
              
              console.log('Merging scenario:', newScenario.id, '->', newScenario.name);
              
              // Try to find by ID first (if we have one)
              let existingIndex = -1;
              if (newScenario.id) {
                existingIndex = existingScenarios.findIndex(s => s && s.id === newScenario.id);
              }
              
              // If not found by ID, try to find by name (case-insensitive)
              if (existingIndex === -1 && newScenario.name && typeof newScenario.name === 'string') {
                const normalizedName = newScenario.name.toLowerCase().trim();
                existingIndex = existingScenarios.findIndex(s => 
                  s && s.name && typeof s.name === 'string' && s.name.toLowerCase().trim() === normalizedName
                );
              }
              
              if (existingIndex >= 0) {
                console.log('Found existing scenario at index:', existingIndex);
                const existing = existingScenarios[existingIndex];
                
                // Merge processes - avoid duplicates by id
                const existingIds = new Set(existing.processes.map(p => p && p.id));
                const newProcesses = (newScenario.processes || []).filter(p => p && p.id && !existingIds.has(p.id));
                existing.processes = [...existing.processes, ...newProcesses];
                
                if (newScenario.name && typeof newScenario.name === 'string') {
                  existing.name = newScenario.name;
                }
                
                console.log('Updated scenario, processes now:', existing.processes.length);
                return existingScenarios;
              } else {
                console.log('Adding new scenario:', newScenario.id || 'new');
                const newEntry = {
                  id: newScenario.id || 'scenario_' + Date.now() + '_' + existingScenarios.length,
                  name: (typeof newScenario.name === 'string' ? newScenario.name : 'Scenario ' + (existingScenarios.length + 1)),
                  processes: Array.isArray(newScenario.processes) ? newScenario.processes : []
                };
                existingScenarios.push(newEntry);
                return existingScenarios;
              }
            }
            
            // ============================================================
            // FUNCTION: Extract scenarios from diff
            // ============================================================
            function extractScenariosFromDiff(diff) {
              const extracted = [];
              
              // Case 1: diff.scenarios is an array
              if (diff.scenarios && Array.isArray(diff.scenarios)) {
                for (const item of diff.scenarios) {
                  const scenario = extractScenarioFromDiff(item);
                  if (scenario) extracted.push(scenario);
                }
                return extracted;
              }
              
              // Case 2: diff.scenarios is an object with _t: 'a' (array diff)
              if (diff.scenarios && typeof diff.scenarios === 'object' && diff.scenarios._t === 'a') {
                for (const key in diff.scenarios) {
                  if (key === '_t') continue;
                  const value = diff.scenarios[key];
                  
                  let scenarioData = null;
                  
                  // Try to extract scenario from various structures
                  if (Array.isArray(value) && value.length > 0) {
                    // Check if any element in the array is a scenario object
                    for (const element of value) {
                      if (element && typeof element === 'object' && (element.id || element.name || element.processes)) {
                        const extracted = extractScenarioFromDiff(element);
                        if (extracted) {
                          scenarioData = extracted;
                          break;
                        }
                      }
                    }
                    // If not found, try the first element
                    if (!scenarioData && typeof value[0] === 'object') {
                      scenarioData = extractScenarioFromDiff(value[0]);
                    }
                  } else if (value && typeof value === 'object') {
                    scenarioData = extractScenarioFromDiff(value);
                  }
                  
                  if (scenarioData) {
                    extracted.push(scenarioData);
                  }
                }
                return extracted;
              }
              
              // Case 3: diff.scenarios is an object with numeric keys
              if (diff.scenarios && typeof diff.scenarios === 'object') {
                for (const key in diff.scenarios) {
                  if (key === '_t') continue;
                  const value = diff.scenarios[key];
                  if (value && typeof value === 'object') {
                    const scenario = extractScenarioFromDiff(value);
                    if (scenario) {
                      extracted.push(scenario);
                    }
                  }
                }
                return extracted;
              }
              
              // Case 4: diff itself is a scenario
              const selfScenario = extractScenarioFromDiff(diff);
              if (selfScenario) {
                extracted.push(selfScenario);
                return extracted;
              }
              
              // Case 5: Try to find any scenario-like object in the diff
              for (const key in diff) {
                if (key === '_t' || key === 'scenarios') continue;
                const value = diff[key];
                if (value && typeof value === 'object') {
                  const scenario = extractScenarioFromDiff(value);
                  if (scenario) {
                    extracted.push(scenario);
                  }
                }
              }
              
              return extracted;
            }
            
            // ============================================================
            // FUNCTION: Process Gist
            // ============================================================
            function processGist(gistId) {
              console.log('Fetching data from Gist:', gistId);
              const token = process.env.GITHUB_TOKEN;
              if (!token) {
                console.error('GITHUB_TOKEN not found');
                process.exit(1);
              }
              
              const gistUrl = 'https://api.github.com/gists/' + gistId;
              
              fetch(gistUrl, {
                headers: {
                  'Authorization': 'token ' + token,
                  'Accept': 'application/vnd.github.v3+json'
                }
              })
              .then(function(response) {
                if (!response.ok) {
                  throw new Error('Gist API returned ' + response.status);
                }
                return response.json();
              })
              .then(function(gistData) {
                const files = gistData.files;
                const fileNames = Object.keys(files);
                if (fileNames.length === 0) {
                  throw new Error('No files in gist');
                }
                const fileContent = files[fileNames[0]].content;
                console.log('Gist file content length:', fileContent.length);
                
                try {
                  const parsedData = JSON.parse(fileContent);
                  console.log('Gist data parsed successfully');
                  console.log('Parsed data keys:', Object.keys(parsedData));
                  applyChanges(parsedData);
                } catch (e) {
                  console.error('Failed to parse Gist content:', e.message);
                  process.exit(1);
                }
                
                return fetch('https://api.github.com/gists/' + gistId, {
                  method: 'DELETE',
                  headers: { 'Authorization': 'token ' + token }
                });
              })
              .then(function() {
                console.log('Gist deleted');
              })
              .catch(function(e) {
                console.error('Gist processing failed:', e.message);
                process.exit(1);
              });
            }
            
            // ============================================================
            // FUNCTION: Apply changes to data
            // ============================================================
            function applyChanges(parsedData) {
              let resultData = JSON.parse(JSON.stringify(currentData));
              console.log('Current data scenarios before any changes:', resultData.scenarios?.length || 0);
              
              if (!resultData.scenarios || !Array.isArray(resultData.scenarios)) {
                resultData.scenarios = [];
              }
              
              // Extract scenarios from the parsed data
              const extractedScenarios = extractScenariosFromDiff(parsedData);
              console.log('Extracted scenarios from diff:', extractedScenarios.length);
              
              if (extractedScenarios.length === 0) {
                console.log('No scenarios extracted, checking if parsedData itself is a scenario...');
                const directScenario = extractScenarioFromDiff(parsedData);
                if (directScenario) {
                  extractedScenarios.push(directScenario);
                  console.log('Added direct scenario from parsedData');
                }
              }
              
              // Log extracted scenarios for debugging
              for (const scenario of extractedScenarios) {
                const processCount = scenario.processes?.length || 0;
                console.log('  Scenario extracted:', scenario.id, '|', scenario.name, '| processes:', processCount);
              }
              
              // Merge each extracted scenario into the result
              for (const scenario of extractedScenarios) {
                if (scenario) {
                  resultData.scenarios = mergeScenarioIntoArray(resultData.scenarios, scenario);
                }
              }
              
              // Handle currentScenarioId
              let newCurrentId = parsedData.currentScenarioId;
              if (newCurrentId) {
                // Extract string from nested arrays
                newCurrentId = extractStringFromNestedArray(newCurrentId);
              }
              
              if (newCurrentId) {
                const exists = resultData.scenarios.some(s => s && s.id === newCurrentId);
                if (exists) {
                  resultData.currentScenarioId = newCurrentId;
                  console.log('Set currentScenarioId to:', newCurrentId);
                } else {
                  console.log('New currentScenarioId not found in scenarios, checking by name...');
                  // Try to find by name
                  const byName = resultData.scenarios.find(s => s && s.name === newCurrentId);
                  if (byName) {
                    resultData.currentScenarioId = byName.id;
                    console.log('Set currentScenarioId to:', byName.id);
                  } else {
                    console.log('New currentScenarioId not found, keeping existing');
                  }
                }
              }
              
              // Ensure currentScenarioId is valid
              if (!resultData.currentScenarioId || !resultData.scenarios.some(s => s && s.id === resultData.currentScenarioId)) {
                if (resultData.scenarios.length > 0) {
                  resultData.currentScenarioId = resultData.scenarios[0].id;
                  console.log('Set currentScenarioId to first scenario:', resultData.currentScenarioId);
                }
              }
              
              // Ensure master data exists
              if (!resultData.departments || !Array.isArray(resultData.departments)) {
                resultData.departments = ['Sales', 'Production Planning', 'Material Planning', 'Material Handling', 'Purchase', 'Production Execution', 'Parts Quality', 'Vehicle Quality', 'Finance', 'Trade & Compliance'];
              }
              
              if (!resultData.sysNameList || !Array.isArray(resultData.sysNameList)) {
                resultData.sysNameList = ['SAP', 'LES', 'MES', 'KAPTURE', 'WMS', 'To Be Determined'];
              }
              
              if (!resultData.businessStatuses || !Array.isArray(resultData.businessStatuses)) {
                resultData.businessStatuses = [
                  { value: 'Not Defined', color: 'red' },
                  { value: 'In Progress', color: 'yellow' },
                  { value: 'Completed', color: 'green' }
                ];
              }
              
              if (!resultData.sysStatusList || !Array.isArray(resultData.sysStatusList)) {
                resultData.sysStatusList = [
                  { value: 'Operational', color: 'green' },
                  { value: 'Completed', color: 'green' },
                  { value: 'Offline', color: 'red' },
                  { value: 'To Be Implemented', color: 'red' },
                  { value: 'Work in Progress', color: 'yellow' }
                ];
              }
              
              if (!resultData.sysRespList || !Array.isArray(resultData.sysRespList)) {
                resultData.sysRespList = [];
              }
              
              console.log('Final scenarios count:', resultData.scenarios.length);
              console.log('Final currentScenarioId:', resultData.currentScenarioId);
              
              fs.writeFileSync('data.json', JSON.stringify(resultData, null, 2));
              console.log('data.json updated successfully');
            }
            
            // ============================================================
            // MAIN EXECUTION
            // ============================================================
            if (payloadType === 'gist' && payload.gist_id) {
              processGist(payload.gist_id);
              setTimeout(function() {}, 30000);
            } else {
              console.log('Processing direct payload...');
              let payloadData = payload.data || '';
              console.log('Payload data length:', payloadData.length);
              
              if (payloadData && payloadData.length > 0) {
                try {
                  const parsedData = JSON.parse(payloadData);
                  console.log('Direct payload parsed successfully');
                  console.log('Parsed data keys:', Object.keys(parsedData));
                  applyChanges(parsedData);
                } catch (e) {
                  console.error('Failed to parse payload data:', e.message);
                  console.log('Payload data preview:', payloadData.substring(0, 200));
                  process.exit(1);
                }
              } else {
                console.error('No data found in payload');
                process.exit(1);
              }
            }
          "

      - name: Validate JSON
        run: |
          if [ -f data.json ] && [ -s data.json ]; then
            if ! jq empty data.json 2>/dev/null; then
              echo "Invalid JSON in data.json"
              cat data.json | head -100
              exit 1
            fi
            echo "JSON validation passed"
          fi

      - name: Commit and push
        run: |
          if [ -f data.json ] && git diff --quiet data.json; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Apply changes from web [skip ci]" || echo "No changes to commit"
            git push
          fi
