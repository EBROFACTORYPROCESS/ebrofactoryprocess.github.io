name: Update data.json from web

on:
  repository_dispatch:
    types: [update-data]

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install jsondiffpatch
        run: npm install jsondiffpatch@0.4.1

      - name: Write payload to file
        run: |
          cat > payload.json << 'EOF'
          ${{ toJSON(github.event.client_payload) }}
          EOF

      - name: Apply changes
        run: |
          node -e '
            const fs = require("fs");
            const jsondiffpatch = require("jsondiffpatch");

            console.log("=== Applying changes ===");

            // Read current data
            let currentData = {};
            try {
              currentData = JSON.parse(fs.readFileSync("data.json", "utf8"));
              console.log("Current data loaded, scenarios:", currentData.scenarios?.length || 0);
            } catch (e) {
              console.log("No existing data.json, starting fresh");
            }

            // Read payload
            const payload = JSON.parse(fs.readFileSync("payload.json", "utf8"));
            console.log("Payload type:", payload.type);

            // Handle different payload types
            if (payload.type === "gist" && payload.gist_id) {
              console.log("Gist mode not implemented in this version, falling back to diff");
              // Process as diff instead if data is present
              if (payload.data) {
                const diff = JSON.parse(payload.data);
                const result = jsondiffpatch.patch(currentData, diff);
                fs.writeFileSync("data.json", JSON.stringify(result, null, 2));
                console.log("✅ Patch applied (from gist data)");
              } else {
                console.log("⚠️ No data in gist payload");
              }
            } else if (payload.type === "diff" && payload.data) {
              const diff = JSON.parse(payload.data);
              const result = jsondiffpatch.patch(currentData, diff);
              fs.writeFileSync("data.json", JSON.stringify(result, null, 2));
              console.log("✅ Patch applied successfully");
              
            } else if (payload.type === "node-diff" && payload.data) {
                const diff = JSON.parse(payload.data);
                // diff is { scenarioId: { nodes: { nodeId: { x, y, hidden } } } }
                console.log("Applying node-diff by ID");
                let result = JSON.parse(JSON.stringify(currentData)); // deep clone
            
                for (const scId in diff) {
                    const scenarioDiff = diff[scId];
                    const scenario = result.scenarios.find(s => s.id === scId);
                    if (!scenario) continue;
                    if (!scenario.workflow) scenario.workflow = { nodes: [], connections: [] };
                    const nodes = scenario.workflow.nodes || [];
                    // For each node change
                    for (const nodeId in scenarioDiff.nodes) {
                        const changes = scenarioDiff.nodes[nodeId];
                        const node = nodes.find(n => n.id === nodeId);
                        if (node) {
                            // Apply changes
                            if (changes.x !== undefined) node.x = changes.x;
                            if (changes.y !== undefined) node.y = changes.y;
                            if (changes.hidden !== undefined) node.hidden = changes.hidden;
                        } else {
                            // Node not found – maybe it was added? For now, ignore.
                            console.warn(`Node ${nodeId} not found in scenario ${scId}`);
                        }
                    }
                }
                fs.writeFileSync("data.json", JSON.stringify(result, null, 2));
                console.log("✅ Node-diff applied successfully");
                
            } else if (payload.type === "full" && payload.data) {
              const newData = JSON.parse(payload.data);
              fs.writeFileSync("data.json", JSON.stringify(newData, null, 2));
              console.log("✅ Full data written");
            } else {
              console.log("⚠️ No valid data to apply");
            }

            console.log("✅ Apply changes completed");
          '

      - name: Validate JSON
        run: |
          if [ -f data.json ] && [ -s data.json ]; then
            if ! jq empty data.json 2>/dev/null; then
              echo "❌ Invalid JSON in data.json"
              cat data.json | head -100
              exit 1
            fi
            echo "✅ JSON validation passed"
          else
            echo "⚠️ data.json missing or empty"
            exit 1
          fi

      - name: Commit and push
        run: |
          if [ -f data.json ] && git diff --quiet data.json; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Apply changes from web [skip ci]" || echo "No changes to commit"
            git push --no-verify origin HEAD:main || git push --force origin HEAD:main
          fi
