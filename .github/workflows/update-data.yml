name: Update data.json from web

on:
  repository_dispatch:
    types: [update-data]

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install jsondiffpatch
        run: npm install jsondiffpatch@0.4.1

      - name: Write payload to file
        run: |
          cat > payload.json << 'EOF'
          ${{ toJSON(github.event.client_payload) }}
          EOF

      - name: Apply changes
        run: |
          node -e "
            const fs = require('fs');
            const jsondiffpatch = require('jsondiffpatch');
            
            console.log('=== Starting apply changes ===');
            
            // Read current data.json
            let currentData = {};
            try {
              const content = fs.readFileSync('data.json', 'utf8');
              currentData = JSON.parse(content);
              console.log('Current data loaded, scenarios:', currentData.scenarios?.length || 0);
            } catch (e) {
              console.log('No existing data.json, creating new one');
            }
            
            // Read payload
            const payloadContent = fs.readFileSync('payload.json', 'utf8');
            console.log('Payload content length:', payloadContent.length);
            
            let payload;
            try {
              payload = JSON.parse(payloadContent);
              console.log('Payload parsed successfully');
              console.log('Payload keys:', Object.keys(payload));
            } catch (e) {
              console.error('Failed to parse payload.json:', e.message);
              process.exit(1);
            }
            
            const payloadType = payload.type || 'diff';
            const gistId = payload.gist_id || '';
            let finalData = null;
            
            console.log('Payload type:', payloadType);
            console.log('Gist ID:', gistId || '(none)');
            
            // ============================================================
            // FUNCTION: Clean a scenario object
            // ============================================================
            function cleanScenario(scenario) {
              if (!scenario || typeof scenario !== 'object') return null;
              
              const cleaned = { id: 'default', name: 'Manufacturing', processes: [] };
              
              // Handle id - can be string or array
              if (scenario.id) {
                cleaned.id = Array.isArray(scenario.id) ? scenario.id[0] : scenario.id;
              }
              
              // Handle name - can be string or array
              if (scenario.name) {
                cleaned.name = Array.isArray(scenario.name) ? scenario.name[0] : scenario.name;
              }
              
              // Handle processes - can be array or object
              if (scenario.processes) {
                if (Array.isArray(scenario.processes)) {
                  cleaned.processes = scenario.processes.filter(p => p && typeof p === 'object' && p.id);
                } else if (typeof scenario.processes === 'object') {
                  // Convert object with numeric keys to array
                  const procArray = [];
                  for (const key in scenario.processes) {
                    if (key === '_t') continue;
                    const val = scenario.processes[key];
                    if (Array.isArray(val) && val.length > 0) {
                      // Take the first valid process from the array
                      const firstValid = val.find(p => p && typeof p === 'object' && p.id);
                      if (firstValid) procArray.push(firstValid);
                    } else if (val && typeof val === 'object' && val.id) {
                      procArray.push(val);
                    }
                  }
                  cleaned.processes = procArray;
                }
              }
              
              return cleaned;
            }
            
            // ============================================================
            // FUNCTION: Apply diff and preserve existing data
            // ============================================================
            function applyDiffAndMerge(current, diff) {
              console.log('Applying diff to current data...');
              
              // Deep clone current data to avoid mutation
              let result = JSON.parse(JSON.stringify(current));
              
              // Handle scenarios specially
              if (diff.scenarios) {
                if (Array.isArray(diff.scenarios)) {
                  // Diff scenarios is an array - merge it
                  console.log('Merging scenarios array...');
                  result.scenarios = mergeScenarios(result.scenarios || [], diff.scenarios);
                } else if (diff.scenarios._t === 'a') {
                  // Diff scenarios is an array diff with _t: 'a'
                  console.log('Processing array diff for scenarios...');
                  result.scenarios = mergeScenarioArrayDiff(result.scenarios || [], diff.scenarios);
                } else if (typeof diff.scenarios === 'object') {
                  // Diff scenarios is an object with numeric keys
                  console.log('Merging scenarios object...');
                  result.scenarios = mergeScenarioObject(result.scenarios || [], diff.scenarios);
                }
                
                // Clean and validate all scenarios
                result.scenarios = result.scenarios
                  .map(s => cleanScenario(s))
                  .filter(s => s !== null);
              }
              
              // Handle other top-level keys
              for (const key in diff) {
                if (key === '_t' || key === 'scenarios') continue;
                
                // For array diffs
                if (diff[key] && typeof diff[key] === 'object' && diff[key]._t === 'a') {
                  // This is an array diff - need to merge it
                  result[key] = mergeArrayDiff(result[key] || [], diff[key]);
                } else if (diff[key] && typeof diff[key] === 'object' && !Array.isArray(diff[key])) {
                  // Recursively merge objects
                  if (!result[key] || typeof result[key] !== 'object') {
                    result[key] = {};
                  }
                  result[key] = applyDiffAndMerge(result[key], diff[key]);
                } else {
                  // Primitive value
                  result[key] = diff[key];
                }
              }
              
              return result;
            }
            
            // ============================================================
            // FUNCTION: Merge scenarios from array
            // ============================================================
            function mergeScenarios(current, newScenarios) {
              const result = [...current];
              
              for (const newScenario of newScenarios) {
                if (!newScenario || typeof newScenario !== 'object') continue;
                
                // Check if scenario already exists by id
                const existingIndex = result.findIndex(s => s && s.id === newScenario.id);
                const cleaned = cleanScenario(newScenario);
                
                if (cleaned) {
                  if (existingIndex >= 0) {
                    // Merge with existing
                    result[existingIndex] = { ...result[existingIndex], ...cleaned };
                  } else {
                    // Add new scenario
                    result.push(cleaned);
                  }
                }
              }
              
              return result;
            }
            
            // ============================================================
            // FUNCTION: Merge scenario array diff (_t: 'a')
            // ============================================================
            function mergeScenarioArrayDiff(current, diff) {
              const result = [...current];
              const removals = [];
              const insertions = [];
              const updates = [];
              
              for (const key in diff) {
                if (key === '_t') continue;
                const value = diff[key];
                
                if (key.startsWith('_')) {
                  const index = parseInt(key.substring(1));
                  
                  if (Array.isArray(value)) {
                    if (value.length === 2 && value[1] === 0) {
                      // Removal: [oldValue, 0]
                      removals.push(index);
                    } else if (value.length === 3 && value[2] === 3) {
                      // Move: [oldValue, newIndex, 3]
                      if (index < result.length && result[index]) {
                        insertions.push({ index: value[1], value: result[index] });
                        removals.push(index);
                      }
                    } else if (value.length === 3 && value[2] === 0) {
                      // Replacement: [newValue, 0, 0]
                      if (index < result.length) {
                        const cleaned = cleanScenario(value[0]);
                        if (cleaned) updates.push({ index: index, value: cleaned });
                      }
                    } else if (value.length === 1) {
                      // Single value - treat as insertion
                      const cleaned = cleanScenario(value[0]);
                      if (cleaned) insertions.push({ index: index, value: cleaned });
                    }
                  } else if (value && typeof value === 'object') {
                    // Nested diff on this scenario
                    if (index < result.length && result[index]) {
                      result[index] = applyDiffAndMerge(result[index], { scenarios: value });
                    }
                  }
                } else {
                  const index = parseInt(key);
                  if (!isNaN(index) && index >= 0) {
                    if (Array.isArray(value) && value.length === 1) {
                      const cleaned = cleanScenario(value[0]);
                      if (cleaned) insertions.push({ index: index, value: cleaned });
                    } else if (value && typeof value === 'object') {
                      const cleaned = cleanScenario(value);
                      if (cleaned) insertions.push({ index: index, value: cleaned });
                    }
                  }
                }
              }
              
              // Process removals (highest to lowest)
              removals.sort((a, b) => b - a);
              for (const idx of removals) {
                if (idx < result.length) {
                  result.splice(idx, 1);
                }
              }
              
              // Process updates
              for (const update of updates) {
                if (update.index < result.length) {
                  result[update.index] = { ...result[update.index], ...update.value };
                }
              }
              
              // Process insertions (highest to lowest)
              insertions.sort((a, b) => b.index - a.index);
              for (const ins of insertions) {
                if (ins.index < result.length) {
                  result.splice(ins.index, 0, ins.value);
                } else {
                  result.push(ins.value);
                }
              }
              
              return result;
            }
            
            // ============================================================
            // FUNCTION: Merge scenario object (with numeric keys)
            // ============================================================
            function mergeScenarioObject(current, obj) {
              const result = [...current];
              
              for (const key in obj) {
                if (key === '_t') continue;
                const value = obj[key];
                
                if (key.startsWith('_')) {
                  const index = parseInt(key.substring(1));
                  if (Array.isArray(value) && value.length === 2 && value[1] === 0) {
                    // Removal
                    if (index < result.length) {
                      result.splice(index, 1);
                    }
                  } else if (value && typeof value === 'object') {
                    // Nested diff
                    if (index < result.length && result[index]) {
                      result[index] = applyDiffAndMerge(result[index], { scenarios: value });
                    }
                  }
                } else {
                  const index = parseInt(key);
                  if (!isNaN(index) && index >= 0) {
                    if (Array.isArray(value) && value.length === 1) {
                      const cleaned = cleanScenario(value[0]);
                      if (cleaned) {
                        if (index < result.length) {
                          result[index] = cleaned;
                        } else {
                          result.push(cleaned);
                        }
                      }
                    } else if (value && typeof value === 'object') {
                      const cleaned = cleanScenario(value);
                      if (cleaned) {
                        if (index < result.length) {
                          result[index] = cleaned;
                        } else {
                          result.push(cleaned);
                        }
                      }
                    }
                  }
                }
              }
              
              return result;
            }
            
            // ============================================================
            // FUNCTION: Merge array diff
            // ============================================================
            function mergeArrayDiff(current, diff) {
              const result = [...current];
              const removals = [];
              const insertions = [];
              const updates = [];
              
              for (const key in diff) {
                if (key === '_t') continue;
                const value = diff[key];
                
                if (key.startsWith('_')) {
                  const index = parseInt(key.substring(1));
                  if (Array.isArray(value)) {
                    if (value.length === 2 && value[1] === 0) {
                      removals.push(index);
                    } else if (value.length === 3 && value[2] === 3) {
                      if (index < result.length) {
                        insertions.push({ index: value[1], value: result[index] });
                        removals.push(index);
                      }
                    } else if (value.length === 3 && value[2] === 0) {
                      if (index < result.length) {
                        updates.push({ index: index, value: value[0] });
                      }
                    }
                  } else if (value && typeof value === 'object') {
                    if (index < result.length && result[index] && typeof result[index] === 'object') {
                      result[index] = applyDiffAndMerge(result[index], value);
                    }
                  }
                } else {
                  const index = parseInt(key);
                  if (!isNaN(index) && index >= 0) {
                    if (Array.isArray(value) && value.length === 1) {
                      insertions.push({ index: index, value: value[0] });
                    } else if (value && typeof value === 'object') {
                      if (index < result.length) {
                        result[index] = value;
                      } else {
                        insertions.push({ index: index, value: value });
                      }
                    }
                  }
                }
              }
              
              removals.sort((a, b) => b - a);
              for (const idx of removals) {
                if (idx < result.length) result.splice(idx, 1);
              }
              
              for (const update of updates) {
                if (update.index < result.length) {
                  result[update.index] = update.value;
                }
              }
              
              insertions.sort((a, b) => b.index - a.index);
              for (const ins of insertions) {
                if (ins.index < result.length) {
                  result.splice(ins.index, 0, ins.value);
                } else {
                  result.push(ins.value);
                }
              }
              
              return result;
            }
            
            // ============================================================
            // FUNCTION: Validate and save
            // ============================================================
            function validateAndSave(data) {
              if (!data) {
                console.error('No data to save');
                return false;
              }
              
              // Ensure scenarios is an array
              if (!data.scenarios || !Array.isArray(data.scenarios)) {
                console.error('Invalid data: scenarios is not an array');
                data.scenarios = [];
              }
              
              // Clean all scenarios
              data.scenarios = data.scenarios
                .map(s => cleanScenario(s))
                .filter(s => s !== null);
              
              // Fix currentScenarioId
              if (Array.isArray(data.currentScenarioId)) {
                data.currentScenarioId = data.currentScenarioId[0] || 'default';
              }
              if (!data.currentScenarioId && data.scenarios.length > 0) {
                data.currentScenarioId = data.scenarios[0].id || 'default';
              }
              
              // Ensure master data exists
              if (!data.departments || !Array.isArray(data.departments)) {
                data.departments = ['Sales', 'Production Planning', 'Material Planning', 'Material Handling', 'Purchase', 'Production Execution', 'Parts Quality', 'Vehicle Quality', 'Finance', 'Trade & Compliance'];
              }
              
              if (!data.sysNameList || !Array.isArray(data.sysNameList)) {
                data.sysNameList = ['SAP', 'LES', 'MES', 'KAPTURE', 'WMS', 'To Be Determined'];
              }
              
              if (!data.businessStatuses || !Array.isArray(data.businessStatuses)) {
                data.businessStatuses = [
                  { value: 'Not Defined', color: 'red' },
                  { value: 'In Progress', color: 'yellow' },
                  { value: 'Completed', color: 'green' }
                ];
              }
              
              if (!data.sysStatusList || !Array.isArray(data.sysStatusList)) {
                data.sysStatusList = [
                  { value: 'Operational', color: 'green' },
                  { value: 'Completed', color: 'green' },
                  { value: 'Offline', color: 'red' },
                  { value: 'To Be Implemented', color: 'red' },
                  { value: 'Work in Progress', color: 'yellow' }
                ];
              }
              
              if (!data.sysRespList || !Array.isArray(data.sysRespList)) {
                data.sysRespList = [];
              }
              
              console.log('Final scenarios count:', data.scenarios.length);
              console.log('Final currentScenarioId:', data.currentScenarioId);
              
              fs.writeFileSync('data.json', JSON.stringify(data, null, 2));
              console.log('data.json updated successfully');
              return true;
            }
            
            // ============================================================
            // FUNCTION: Determine if data is a diff or full data
            // ============================================================
            function isDiffData(data) {
              // If it has scenarios as an array with valid data, it might be full data
              if (data.scenarios && Array.isArray(data.scenarios) && data.scenarios.length > 0) {
                // Check if any scenario has valid processes
                const hasValidProcess = data.scenarios.some(s => 
                  s && s.processes && Array.isArray(s.processes) && s.processes.length > 0
                );
                if (hasValidProcess) {
                  return false; // This is likely full data
                }
              }
              
              // Check for diff markers like _t: 'a' or numeric keys in scenarios
              if (data.scenarios && typeof data.scenarios === 'object') {
                if (data.scenarios._t === 'a' || Object.keys(data.scenarios).some(k => !isNaN(k) && k !== '_t')) {
                  return true; // This is a diff
                }
              }
              
              return true; // Default to treating as diff
            }
            
            // ============================================================
            // PROCESS PAYLOAD
            // ============================================================
            if (payloadType === 'gist' && gistId && gistId.length > 0) {
              console.log('Downloading data from Gist:', gistId);
              
              const token = process.env.GITHUB_TOKEN;
              if (!token) {
                console.error('GITHUB_TOKEN not found');
                process.exit(1);
              }
              
              const gistUrl = 'https://api.github.com/gists/' + gistId;
              
              fetch(gistUrl, {
                headers: {
                  'Authorization': 'token ' + token,
                  'Accept': 'application/vnd.github.v3+json',
                  'User-Agent': 'BPO-Workflow'
                }
              })
              .then(function(response) {
                if (!response.ok) {
                  throw new Error('Gist API returned ' + response.status);
                }
                return response.json();
              })
              .then(function(gistData) {
                const files = gistData.files;
                const fileNames = Object.keys(files);
                if (fileNames.length === 0) {
                  throw new Error('No files found in gist');
                }
                
                const fileContent = files[fileNames[0]].content;
                console.log('Downloaded data length:', fileContent.length);
                const parsedData = JSON.parse(fileContent);
                console.log('Parsed successfully');
                
                if (isDiffData(parsedData)) {
                  console.log('Detected as diff, applying to current data...');
                  finalData = applyDiffAndMerge(currentData, parsedData);
                } else {
                  console.log('Detected as full data, using directly...');
                  finalData = parsedData;
                }
                
                const success = validateAndSave(finalData);
                if (!success) process.exit(1);
                
                if (token && gistId) {
                  console.log('Deleting temporary Gist...');
                  return fetch('https://api.github.com/gists/' + gistId, {
                    method: 'DELETE',
                    headers: {
                      'Authorization': 'token ' + token,
                      'Accept': 'application/vnd.github.v3+json'
                    }
                  });
                }
              })
              .then(function() {
                console.log('Gist deleted');
              })
              .catch(function(e) {
                console.error('Failed to process gist:', e.message);
                process.exit(1);
              });
              
              setTimeout(function() {}, 30000);
              
            } else {
              // Direct diff payload
              console.log('Processing direct payload...');
              let payloadData = payload.data || '';
              console.log('Payload data length:', payloadData.length);
              
              if (payloadData && payloadData.length > 0) {
                try {
                  const parsedData = JSON.parse(payloadData);
                  console.log('Payload parsed successfully');
                  console.log('Parsed data keys:', Object.keys(parsedData));
                  
                  if (isDiffData(parsedData)) {
                    console.log('Detected as diff, applying to current data...');
                    finalData = applyDiffAndMerge(currentData, parsedData);
                  } else {
                    console.log('Detected as full data, using directly...');
                    finalData = parsedData;
                  }
                  
                  const success = validateAndSave(finalData);
                  if (!success) process.exit(1);
                  
                } catch (e) {
                  console.error('Failed to parse payload data:', e.message);
                  console.log('Payload data preview:', payloadData.substring(0, 200));
                  process.exit(1);
                }
              } else {
                console.error('No data found in payload');
                process.exit(1);
              }
            }
          "

      - name: Validate JSON
        run: |
          if [ -f data.json ] && [ -s data.json ]; then
            if ! jq empty data.json 2>/dev/null; then
              echo "Invalid JSON in data.json"
              cat data.json | head -100
              exit 1
            fi
            echo "JSON validation passed"
          fi

      - name: Commit and push
        run: |
          if [ -f data.json ] && git diff --quiet data.json; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Apply changes from web [skip ci]" || echo "No changes to commit"
            git push
          fi
