name: Update data.json from web

on:
  repository_dispatch:
    types: [update-data]

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install jsondiffpatch
        run: npm install jsondiffpatch@0.4.1

      - name: Write payload to file
        run: |
          cat > payload.json << 'EOF'
          ${{ toJSON(github.event.client_payload) }}
          EOF

      - name: Apply changes
        run: |
          node -e "
            const fs = require('fs');
            
            console.log('=== Starting apply changes ===');
            
            // Read current data.json
            let currentData = {};
            try {
              const content = fs.readFileSync('data.json', 'utf8');
              currentData = JSON.parse(content);
              console.log('Current data loaded, scenarios:', currentData.scenarios?.length || 0);
            } catch (e) {
              console.log('No existing data.json, creating new one');
            }
            
            // Read payload
            const payloadContent = fs.readFileSync('payload.json', 'utf8');
            console.log('Payload content length:', payloadContent.length);
            
            let payload;
            try {
              payload = JSON.parse(payloadContent);
              console.log('✅ Payload parsed successfully');
              console.log('Payload keys:', Object.keys(payload));
            } catch (e) {
              console.error('Failed to parse payload.json:', e.message);
              process.exit(1);
            }
            
            const payloadType = payload.type || 'diff';
            const gistId = payload.gist_id || '';
            let finalData = null;
            
            console.log('Payload type:', payloadType);
            console.log('Gist ID:', gistId || '(none)');
            
            // ============================================================
            // FUNCTION: Clean a process object
            // ============================================================
            function cleanProcess(process) {
              if (!process || typeof process !== 'object') return null;
              const cleaned = { ...process };
              // Ensure all required fields exist
              if (!cleaned.id) return null;
              if (!cleaned.seq) cleaned.seq = '0';
              if (!cleaned.name) cleaned.name = 'Unnamed Process';
              if (!cleaned.description) cleaned.description = '';
              if (!cleaned.raci) cleaned.raci = { r: [], a: [], c: [], i: [] };
              if (!cleaned.businessStatus) cleaned.businessStatus = 'Not Defined';
              if (!cleaned.system) cleaned.system = { name: 'To Be Determined', status: 'Offline', responsible: '' };
              if (!cleaned.notes) cleaned.notes = '';
              if (!cleaned.businessDoc) cleaned.businessDoc = '';
              if (!cleaned.userManual) cleaned.userManual = '';
              return cleaned;
            }
            
            // ============================================================
            // FUNCTION: Clean a scenario object
            // ============================================================
            function cleanScenario(scenario) {
              if (!scenario || typeof scenario !== 'object') return null;
              
              const cleaned = { 
                id: 'scenario_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                name: 'Unnamed Scenario',
                processes: []
              };
              
              // Handle id - can be string or array
              if (scenario.id) {
                cleaned.id = Array.isArray(scenario.id) ? scenario.id[0] : scenario.id;
              }
              
              // Handle name - can be string or array
              if (scenario.name) {
                cleaned.name = Array.isArray(scenario.name) ? scenario.name[0] : scenario.name;
              }
              
              // Handle processes - can be array or object
              if (scenario.processes) {
                if (Array.isArray(scenario.processes)) {
                  cleaned.processes = scenario.processes
                    .map(p => cleanProcess(p))
                    .filter(p => p !== null);
                } else if (typeof scenario.processes === 'object') {
                  // Convert object with numeric keys to array
                  const procArray = [];
                  for (const key in scenario.processes) {
                    if (key === '_t') continue;
                    const val = scenario.processes[key];
                    if (Array.isArray(val)) {
                      // Take the first valid process from the array
                      const firstValid = val.find(p => p && typeof p === 'object' && p.id);
                      if (firstValid) procArray.push(cleanProcess(firstValid));
                    } else if (val && typeof val === 'object') {
                      // Direct process object or nested diff
                      if (val.id) {
                        // Direct process object
                        procArray.push(cleanProcess(val));
                      } else {
                        // Possibly a nested diff - try to extract a process
                        const extracted = extractProcessFromDiff(val);
                        if (extracted) procArray.push(extracted);
                      }
                    }
                  }
                  cleaned.processes = procArray.filter(p => p !== null);
                }
              }
              
              // Ensure processes are sorted by seq
              cleaned.processes.sort((a, b) => {
                const seqA = parseFloat(a.seq) || 0;
                const seqB = parseFloat(b.seq) || 0;
                return seqA - seqB;
              });
              
              return cleaned;
            }
            
            // ============================================================
            // FUNCTION: Extract process from nested diff
            // ============================================================
            function extractProcessFromDiff(diff) {
              if (!diff || typeof diff !== 'object') return null;
              const process = { id: null };
              
              // Try to find id in the diff
              for (const key in diff) {
                if (key === '_t') continue;
                const value = diff[key];
                if (key === 'id' && Array.isArray(value) && value.length > 0) {
                  process.id = value[0];
                } else if (key === 'seq' && Array.isArray(value) && value.length > 0) {
                  process.seq = value[0];
                } else if (key === 'name' && Array.isArray(value) && value.length > 0) {
                  process.name = value[0];
                } else if (key === 'description' && Array.isArray(value) && value.length > 0) {
                  process.description = value[0];
                } else if (key === 'businessStatus' && Array.isArray(value) && value.length > 0) {
                  process.businessStatus = value[0];
                } else if (key === 'raci' && typeof value === 'object') {
                  process.raci = {};
                  for (const raciKey in value) {
                    if (raciKey === '_t') continue;
                    process.raci[raciKey] = Array.isArray(value[raciKey]) ? value[raciKey] : [];
                  }
                } else if (key === 'system' && typeof value === 'object') {
                  process.system = {};
                  for (const sysKey in value) {
                    if (sysKey === '_t') continue;
                    process.system[sysKey] = Array.isArray(value[sysKey]) ? value[sysKey][0] : value[sysKey];
                  }
                } else if (!process[key] && !Array.isArray(value)) {
                  process[key] = value;
                }
              }
              
              return process.id ? cleanProcess(process) : null;
            }
            
            // ============================================================
            // FUNCTION: Merge scenarios from a full array
            // ============================================================
            function mergeFullScenarios(current, newScenarios) {
              const result = [...current];
              
              for (const newScenario of newScenarios) {
                if (!newScenario || typeof newScenario !== 'object') continue;
                const cleaned = cleanScenario(newScenario);
                if (!cleaned) continue;
                
                // Check if scenario already exists by name (case-insensitive) or id
                const existingIndex = result.findIndex(s => 
                  s && (s.id === cleaned.id || s.name.toLowerCase() === cleaned.name.toLowerCase())
                );
                
                if (existingIndex >= 0) {
                  // Merge with existing scenario
                  const existing = result[existingIndex];
                  // Merge processes - avoid duplicates by id
                  const existingIds = new Set(existing.processes.map(p => p.id));
                  const newProcesses = cleaned.processes.filter(p => !existingIds.has(p.id));
                  existing.processes = [...existing.processes, ...newProcesses];
                  existing.name = cleaned.name; // Update name in case it changed
                  result[existingIndex] = existing;
                } else {
                  // Add new scenario
                  result.push(cleaned);
                }
              }
              
              return result;
            }
            
            // ============================================================
            // FUNCTION: Merge scenario array diff (_t: 'a')
            // ============================================================
            function mergeScenarioArrayDiff(current, diff) {
              const result = [...current];
              const removals = [];
              const insertions = [];
              const updates = [];
              
              for (const key in diff) {
                if (key === '_t') continue;
                const value = diff[key];
                
                if (key.startsWith('_')) {
                  const index = parseInt(key.substring(1));
                  if (index >= result.length) continue;
                  
                  if (Array.isArray(value)) {
                    // Handle different array diff operations
                    if (value.length === 2 && value[1] === 0) {
                      // Removal: [oldValue, 0]
                      removals.push(index);
                    } else if (value.length === 3 && value[2] === 3) {
                      // Move: [oldValue, newIndex, 3]
                      if (index < result.length && result[index]) {
                        insertions.push({ index: value[1], value: result[index] });
                        removals.push(index);
                      }
                    } else if (value.length === 3 && value[2] === 0) {
                      // Replacement: [newValue, 0, 0]
                      const cleaned = cleanScenario(value[0]);
                      if (cleaned) updates.push({ index: index, value: cleaned });
                    } else if (value.length === 1) {
                      // Single value - treat as insertion of a scenario
                      const cleaned = cleanScenario(value[0]);
                      if (cleaned) insertions.push({ index: index, value: cleaned });
                    }
                  } else if (value && typeof value === 'object') {
                    // Nested diff on this scenario
                    if (index < result.length && result[index]) {
                      const updatedScenario = applyDiffToScenario(result[index], value);
                      if (updatedScenario) updates.push({ index: index, value: updatedScenario });
                    }
                  }
                } else if (!isNaN(key) && parseInt(key) >= 0) {
                  // Numeric key: insertion of a new scenario
                  const index = parseInt(key);
                  if (Array.isArray(value) && value.length === 1) {
                    const cleaned = cleanScenario(value[0]);
                    if (cleaned) insertions.push({ index: index, value: cleaned });
                  } else if (value && typeof value === 'object') {
                    const cleaned = cleanScenario(value);
                    if (cleaned) insertions.push({ index: index, value: cleaned });
                  }
                }
              }
              
              // Process removals (highest to lowest)
              removals.sort((a, b) => b - a);
              for (const idx of removals) {
                if (idx < result.length) {
                  result.splice(idx, 1);
                }
              }
              
              // Process updates
              for (const update of updates) {
                if (update.index < result.length) {
                  result[update.index] = update.value;
                }
              }
              
              // Process insertions (highest to lowest)
              insertions.sort((a, b) => b.index - a.index);
              for (const ins of insertions) {
                if (ins.index < result.length) {
                  result.splice(ins.index, 0, ins.value);
                } else {
                  result.push(ins.value);
                }
              }
              
              return result;
            }
            
            // ============================================================
            // FUNCTION: Apply diff to a single scenario
            // ============================================================
            function applyDiffToScenario(scenario, diff) {
              if (!scenario || !diff) return null;
              const result = { ...scenario };
              
              for (const key in diff) {
                if (key === '_t') continue;
                const value = diff[key];
                
                if (key === 'processes' && value && typeof value === 'object') {
                  if (value._t === 'a') {
                    // Apply array diff to processes
                    result.processes = mergeProcessArrayDiff(result.processes || [], value);
                  } else if (Array.isArray(value)) {
                    // Merge full processes array
                    result.processes = mergeFullProcesses(result.processes || [], value);
                  } else if (typeof value === 'object') {
                    // Process diff as object with numeric keys
                    result.processes = mergeProcessObject(result.processes || [], value);
                  }
                } else if (Array.isArray(value) && value.length === 1) {
                  result[key] = value[0];
                } else if (!Array.isArray(value) && typeof value !== 'object') {
                  result[key] = value;
                }
              }
              
              return cleanScenario(result);
            }
            
            // ============================================================
            // FUNCTION: Merge full processes array
            // ============================================================
            function mergeFullProcesses(current, newProcesses) {
              const result = [...current];
              const existingIds = new Set(result.map(p => p.id));
              
              for (const newProc of newProcesses) {
                if (!newProc || typeof newProc !== 'object') continue;
                const cleaned = cleanProcess(newProc);
                if (!cleaned) continue;
                
                // Check if process already exists by id
                const existingIndex = result.findIndex(p => p && p.id === cleaned.id);
                if (existingIndex >= 0) {
                  // Merge with existing process
                  result[existingIndex] = { ...result[existingIndex], ...cleaned };
                } else if (!existingIds.has(cleaned.id)) {
                  // Add new process
                  result.push(cleaned);
                  existingIds.add(cleaned.id);
                }
              }
              
              return result;
            }
            
            // ============================================================
            // FUNCTION: Merge process array diff (_t: 'a')
            // ============================================================
            function mergeProcessArrayDiff(current, diff) {
              const result = [...current];
              const removals = [];
              const insertions = [];
              const updates = [];
              
              for (const key in diff) {
                if (key === '_t') continue;
                const value = diff[key];
                
                if (key.startsWith('_')) {
                  const index = parseInt(key.substring(1));
                  if (index >= result.length) continue;
                  
                  if (Array.isArray(value)) {
                    if (value.length === 2 && value[1] === 0) {
                      removals.push(index);
                    } else if (value.length === 3 && value[2] === 3) {
                      if (index < result.length && result[index]) {
                        insertions.push({ index: value[1], value: result[index] });
                        removals.push(index);
                      }
                    } else if (value.length === 3 && value[2] === 0) {
                      const cleaned = cleanProcess(value[0]);
                      if (cleaned) updates.push({ index: index, value: cleaned });
                    } else if (value.length === 1) {
                      const cleaned = cleanProcess(value[0]);
                      if (cleaned) insertions.push({ index: index, value: cleaned });
                    }
                  } else if (value && typeof value === 'object') {
                    // Nested diff on this process
                    if (index < result.length && result[index]) {
                      result[index] = { ...result[index], ...value };
                      const cleaned = cleanProcess(result[index]);
                      if (cleaned) updates.push({ index: index, value: cleaned });
                    }
                  }
                } else if (!isNaN(key) && parseInt(key) >= 0) {
                  const index = parseInt(key);
                  if (Array.isArray(value) && value.length === 1) {
                    const cleaned = cleanProcess(value[0]);
                    if (cleaned) insertions.push({ index: index, value: cleaned });
                  } else if (value && typeof value === 'object') {
                    const cleaned = cleanProcess(value);
                    if (cleaned) insertions.push({ index: index, value: cleaned });
                  }
                }
              }
              
              // Process removals (highest to lowest)
              removals.sort((a, b) => b - a);
              for (const idx of removals) {
                if (idx < result.length) {
                  result.splice(idx, 1);
                }
              }
              
              // Process updates
              for (const update of updates) {
                if (update.index < result.length) {
                  result[update.index] = update.value;
                }
              }
              
              // Process insertions (highest to lowest)
              insertions.sort((a, b) => b.index - a.index);
              for (const ins of insertions) {
                if (ins.index < result.length) {
                  result.splice(ins.index, 0, ins.value);
                } else {
                  result.push(ins.value);
                }
              }
              
              return result;
            }
            
            // ============================================================
            // FUNCTION: Merge process object (with numeric keys)
            // ============================================================
            function mergeProcessObject(current, obj) {
              const result = [...current];
              
              for (const key in obj) {
                if (key === '_t') continue;
                const value = obj[key];
                
                if (key.startsWith('_')) {
                  const index = parseInt(key.substring(1));
                  if (index >= result.length) continue;
                  
                  if (Array.isArray(value) && value.length === 2 && value[1] === 0) {
                    // Removal
                    if (index < result.length) {
                      result.splice(index, 1);
                    }
                  } else if (value && typeof value === 'object') {
                    // Nested diff
                    if (index < result.length && result[index]) {
                      result[index] = { ...result[index], ...value };
                      const cleaned = cleanProcess(result[index]);
                      if (cleaned) result[index] = cleaned;
                    }
                  }
                } else if (!isNaN(key) && parseInt(key) >= 0) {
                  const index = parseInt(key);
                  if (Array.isArray(value) && value.length === 1) {
                    const cleaned = cleanProcess(value[0]);
                    if (cleaned) {
                      if (index < result.length) {
                        result[index] = cleaned;
                      } else {
                        result.push(cleaned);
                      }
                    }
                  } else if (value && typeof value === 'object') {
                    const cleaned = cleanProcess(value);
                    if (cleaned) {
                      if (index < result.length) {
                        result[index] = cleaned;
                      } else {
                        result.push(cleaned);
                      }
                    }
                  }
                }
              }
              
              return result.filter(p => p !== null);
            }
            
            // ============================================================
            // FUNCTION: Main diff application and merge
            // ============================================================
            function applyDiffAndMerge(current, diff) {
              console.log('Applying diff to current data...');
              let result = JSON.parse(JSON.stringify(current));
              
              // Handle scenarios
              if (diff.scenarios) {
                if (Array.isArray(diff.scenarios)) {
                  // Full scenarios array - merge it
                  console.log('Merging full scenarios array...');
                  result.scenarios = mergeFullScenarios(result.scenarios || [], diff.scenarios);
                } else if (diff.scenarios._t === 'a') {
                  // Array diff for scenarios
                  console.log('Processing array diff for scenarios...');
                  result.scenarios = mergeScenarioArrayDiff(result.scenarios || [], diff.scenarios);
                } else if (typeof diff.scenarios === 'object') {
                  // Scenarios as object with numeric keys
                  console.log('Processing scenarios object...');
                  const scenarioArray = [];
                  for (const key in diff.scenarios) {
                    if (key === '_t') continue;
                    const value = diff.scenarios[key];
                    if (value && typeof value === 'object') {
                      const cleaned = cleanScenario(value);
                      if (cleaned) scenarioArray.push(cleaned);
                    }
                  }
                  if (scenarioArray.length > 0) {
                    result.scenarios = mergeFullScenarios(result.scenarios || [], scenarioArray);
                  }
                }
              }
              
              // Handle other top-level keys
              for (const key in diff) {
                if (key === '_t' || key === 'scenarios') continue;
                
                if (diff[key] && typeof diff[key] === 'object' && diff[key]._t === 'a') {
                  // This is an array diff - need to merge it
                  result[key] = mergeArrayDiff(result[key] || [], diff[key]);
                } else if (diff[key] && typeof diff[key] === 'object' && !Array.isArray(diff[key])) {
                  // Recursively merge objects
                  if (!result[key] || typeof result[key] !== 'object') {
                    result[key] = {};
                  }
                  result[key] = applyDiffAndMerge(result[key], diff[key]);
                } else {
                  // Primitive value
                  result[key] = diff[key];
                }
              }
              
              return result;
            }
            
            // ============================================================
            // FUNCTION: Generic array diff merge (fallback)
            // ============================================================
            function mergeArrayDiff(current, diff) {
              const result = [...current];
              const removals = [];
              const insertions = [];
              const updates = [];
              
              for (const key in diff) {
                if (key === '_t') continue;
                const value = diff[key];
                
                if (key.startsWith('_')) {
                  const index = parseInt(key.substring(1));
                  if (Array.isArray(value)) {
                    if (value.length === 2 && value[1] === 0) {
                      removals.push(index);
                    } else if (value.length === 3 && value[2] === 3) {
                      if (index < result.length) {
                        insertions.push({ index: value[1], value: result[index] });
                        removals.push(index);
                      }
                    } else if (value.length === 3 && value[2] === 0) {
                      if (index < result.length) {
                        updates.push({ index: index, value: value[0] });
                      }
                    }
                  } else if (value && typeof value === 'object') {
                    if (index < result.length && result[index] && typeof result[index] === 'object') {
                      result[index] = applyDiffAndMerge(result[index], value);
                    }
                  }
                } else {
                  const index = parseInt(key);
                  if (!isNaN(index) && index >= 0) {
                    if (Array.isArray(value) && value.length === 1) {
                      insertions.push({ index: index, value: value[0] });
                    } else if (value && typeof value === 'object') {
                      if (index < result.length) {
                        result[index] = value;
                      } else {
                        insertions.push({ index: index, value: value });
                      }
                    }
                  }
                }
              }
              
              removals.sort((a, b) => b - a);
              for (const idx of removals) {
                if (idx < result.length) result.splice(idx, 1);
              }
              
              for (const update of updates) {
                if (update.index < result.length) {
                  result[update.index] = update.value;
                }
              }
              
              insertions.sort((a, b) => b.index - a.index);
              for (const ins of insertions) {
                if (ins.index < result.length) {
                  result.splice(ins.index, 0, ins.value);
                } else {
                  result.push(ins.value);
                }
              }
              
              return result;
            }
            
            // ============================================================
            // FUNCTION: Validate and save
            // ============================================================
            function validateAndSave(data) {
              if (!data) {
                console.error('No data to save');
                return false;
              }
              
              // Ensure scenarios is an array
              if (!data.scenarios || !Array.isArray(data.scenarios)) {
                console.error('Invalid data: scenarios is not an array');
                data.scenarios = [];
              }
              
              // Clean all scenarios
              data.scenarios = data.scenarios
                .map(s => cleanScenario(s))
                .filter(s => s !== null);
              
              // Remove duplicate scenario names (keep first occurrence)
              const seenNames = new Set();
              const uniqueScenarios = [];
              for (const scenario of data.scenarios) {
                const nameKey = scenario.name.toLowerCase().trim();
                if (!seenNames.has(nameKey)) {
                  seenNames.add(nameKey);
                  uniqueScenarios.push(scenario);
                } else {
                  console.log(`Removing duplicate scenario: "${scenario.name}"`);
                }
              }
              data.scenarios = uniqueScenarios;
              
              // Fix currentScenarioId
              if (Array.isArray(data.currentScenarioId)) {
                data.currentScenarioId = data.currentScenarioId[0] || 'default';
              }
              if (!data.currentScenarioId && data.scenarios.length > 0) {
                data.currentScenarioId = data.scenarios[0].id || 'default';
              }
              
              // Ensure master data exists
              if (!data.departments || !Array.isArray(data.departments)) {
                data.departments = ['Sales', 'Production Planning', 'Material Planning', 'Material Handling', 'Purchase', 'Production Execution', 'Parts Quality', 'Vehicle Quality', 'Finance', 'Trade & Compliance'];
              }
              
              if (!data.sysNameList || !Array.isArray(data.sysNameList)) {
                data.sysNameList = ['SAP', 'LES', 'MES', 'KAPTURE', 'WMS', 'To Be Determined'];
              }
              
              if (!data.businessStatuses || !Array.isArray(data.businessStatuses)) {
                data.businessStatuses = [
                  { value: 'Not Defined', color: 'red' },
                  { value: 'In Progress', color: 'yellow' },
                  { value: 'Completed', color: 'green' }
                ];
              }
              
              if (!data.sysStatusList || !Array.isArray(data.sysStatusList)) {
                data.sysStatusList = [
                  { value: 'Operational', color: 'green' },
                  { value: 'Completed', color: 'green' },
                  { value: 'Offline', color: 'red' },
                  { value: 'To Be Implemented', color: 'red' },
                  { value: 'Work in Progress', color: 'yellow' }
                ];
              }
              
              if (!data.sysRespList || !Array.isArray(data.sysRespList)) {
                data.sysRespList = [];
              }
              
              console.log('Final scenarios count:', data.scenarios.length);
              console.log('Final currentScenarioId:', data.currentScenarioId);
              
              fs.writeFileSync('data.json', JSON.stringify(data, null, 2));
              console.log('data.json updated successfully');
              return true;
            }
            
            // ============================================================
            // FUNCTION: Determine if data is a diff or full data
            // ============================================================
            function isDiffData(data) {
              // Check if data has a scenarios array with full process objects
              if (data.scenarios && Array.isArray(data.scenarios)) {
                // If any scenario has a full process with a name, it's likely full data
                const hasFullProcess = data.scenarios.some(s => 
                  s && s.processes && Array.isArray(s.processes) && 
                  s.processes.some(p => p && p.name && p.name.length > 0)
                );
                if (hasFullProcess) return false;
              }
              
              // Check for diff markers
              if (data.scenarios && typeof data.scenarios === 'object') {
                if (data.scenarios._t === 'a' || 
                    Object.keys(data.scenarios).some(k => !isNaN(k) && k !== '_t')) {
                  return true;
                }
              }
              
              // If no clear full data indicators, treat as diff
              return true;
            }
            
            // ============================================================
            // PROCESS PAYLOAD
            // ============================================================
            if (payloadType === 'gist' && gistId && gistId.length > 0) {
              console.log('Downloading data from Gist:', gistId);
              
              const token = process.env.GITHUB_TOKEN;
              if (!token) {
                console.error('GITHUB_TOKEN not found');
                process.exit(1);
              }
              
              const gistUrl = 'https://api.github.com/gists/' + gistId;
              
              fetch(gistUrl, {
                headers: {
                  'Authorization': 'token ' + token,
                  'Accept': 'application/vnd.github.v3+json',
                  'User-Agent': 'BPO-Workflow'
                }
              })
              .then(function(response) {
                if (!response.ok) {
                  throw new Error('Gist API returned ' + response.status);
                }
                return response.json();
              })
              .then(function(gistData) {
                const files = gistData.files;
                const fileNames = Object.keys(files);
                if (fileNames.length === 0) {
                  throw new Error('No files found in gist');
                }
                
                const fileContent = files[fileNames[0]].content;
                console.log('Downloaded data length:', fileContent.length);
                const parsedData = JSON.parse(fileContent);
                console.log('Parsed successfully');
                
                if (isDiffData(parsedData)) {
                  console.log('Detected as diff, applying to current data...');
                  finalData = applyDiffAndMerge(currentData, parsedData);
                } else {
                  console.log('Detected as full data, using directly...');
                  finalData = parsedData;
                }
                
                const success = validateAndSave(finalData);
                if (!success) process.exit(1);
                
                if (token && gistId) {
                  console.log('Deleting temporary Gist...');
                  return fetch('https://api.github.com/gists/' + gistId, {
                    method: 'DELETE',
                    headers: {
                      'Authorization': 'token ' + token,
                      'Accept': 'application/vnd.github.v3+json'
                    }
                  });
                }
              })
              .then(function() {
                console.log('Gist deleted');
              })
              .catch(function(e) {
                console.error('Failed to process gist:', e.message);
                process.exit(1);
              });
              
              setTimeout(function() {}, 30000);
              
            } else {
              // Direct diff payload
              console.log('Processing direct payload...');
              let payloadData = payload.data || '';
              console.log('Payload data length:', payloadData.length);
              
              if (payloadData && payloadData.length > 0) {
                try {
                  const parsedData = JSON.parse(payloadData);
                  console.log('Payload parsed successfully');
                  console.log('Parsed data keys:', Object.keys(parsedData));
                  
                  if (isDiffData(parsedData)) {
                    console.log('Detected as diff, applying to current data...');
                    finalData = applyDiffAndMerge(currentData, parsedData);
                  } else {
                    console.log('Detected as full data, using directly...');
                    finalData = parsedData;
                  }
                  
                  const success = validateAndSave(finalData);
                  if (!success) process.exit(1);
                  
                } catch (e) {
                  console.error('Failed to parse payload data:', e.message);
                  console.log('Payload data preview:', payloadData.substring(0, 200));
                  process.exit(1);
                }
              } else {
                console.error('No data found in payload');
                process.exit(1);
              }
            }
          "

      - name: Validate JSON
        run: |
          if [ -f data.json ] && [ -s data.json ]; then
            if ! jq empty data.json 2>/dev/null; then
              echo "Invalid JSON in data.json"
              cat data.json | head -100
              exit 1
            fi
            echo "JSON validation passed"
          fi

      - name: Commit and push
        run: |
          if [ -f data.json ] && git diff --quiet data.json; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Apply changes from web [skip ci]" || echo "No changes to commit"
            git push
          fi
