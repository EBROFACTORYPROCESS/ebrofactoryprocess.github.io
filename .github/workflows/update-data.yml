name: Update data.json from web

on:
  repository_dispatch:
    types: [update-data]

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install jsondiffpatch
        run: npm install jsondiffpatch@0.4.1

      - name: Write payload to file
        run: |
          cat > payload.json << 'EOF'
          ${{ toJSON(github.event.client_payload) }}
          EOF

      - name: Apply diff
        run: |
          node -e "
            const fs = require('fs');
            const jsondiffpatch = require('jsondiffpatch');
            
            console.log('=== Starting apply changes ===');
            
            // Read current data.json
            let currentData = {};
            try {
              const content = fs.readFileSync('data.json', 'utf8');
              currentData = JSON.parse(content);
              console.log('Current data loaded, scenarios:', currentData.scenarios?.length || 0);
            } catch (e) {
              console.log('No existing data.json, creating new one');
            }
            
            // Read payload
            const payloadContent = fs.readFileSync('payload.json', 'utf8');
            console.log('Payload content length:', payloadContent.length);
            
            let payload;
            try {
              payload = JSON.parse(payloadContent);
              console.log('Payload parsed successfully');
              console.log('Payload keys:', Object.keys(payload));
            } catch (e) {
              console.error('Failed to parse payload.json:', e.message);
              process.exit(1);
            }
            
            let diffData = null;
            const payloadType = payload.type || 'diff';
            
            // ============================================================
            // FUNCTION: Process and apply the diff
            // ============================================================
            function applyDiffToData() {
              if (!diffData) {
                console.error('No diff data to apply');
                process.exit(1);
              }
              
              console.log('Applying diff to current data...');
              console.log('Diff data keys:', Object.keys(diffData));
              
              let result = null;
              
              // Try jsondiffpatch first
              try {
                result = jsondiffpatch.patch(currentData, diffData);
                console.log('jsondiffpatch.patch executed successfully');
              } catch (e) {
                console.error('jsondiffpatch.patch threw:', e.message);
              }
              
              // If jsondiffpatch failed, use manual merge
              if (!result) {
                console.log('Falling back to manual merge...');
                result = manualMerge(currentData, diffData);
              }
              
              // Validate and save
              if (!result || !result.scenarios || !Array.isArray(result.scenarios)) {
                console.error('Invalid result: scenarios is not an array');
                console.log('Result:', result ? 'exists' : 'null');
                process.exit(1);
              }
              
              // Clean up the data
              for (let i = 0; i < result.scenarios.length; i++) {
                const sc = result.scenarios[i];
                if (!sc || typeof sc !== 'object') {
                  result.scenarios.splice(i, 1);
                  i--;
                  continue;
                }
                if (!sc.id) sc.id = 'scenario_' + Date.now() + '_' + i;
                if (!sc.name) sc.name = 'Scenario ' + (i + 1);
                if (!sc.processes || !Array.isArray(sc.processes)) {
                  sc.processes = [];
                }
                // Ensure each process has an id
                for (let j = 0; j < sc.processes.length; j++) {
                  const p = sc.processes[j];
                  if (!p || typeof p !== 'object') {
                    sc.processes.splice(j, 1);
                    j--;
                    continue;
                  }
                  if (!p.id) p.id = 'proc_' + Date.now() + '_' + j;
                  if (!p.seq) p.seq = String((j + 1) * 10);
                  if (!p.name) p.name = 'Unnamed Process';
                  if (!p.raci) p.raci = { r: [], a: [], c: [], i: [] };
                  if (!p.system) p.system = { name: 'To Be Determined', status: 'Offline', responsible: '' };
                  if (!p.businessStatus) p.businessStatus = 'Not Defined';
                }
              }
              
              if (Array.isArray(result.currentScenarioId)) {
                result.currentScenarioId = result.currentScenarioId[0] || 'default';
              }
              if (!result.currentScenarioId && result.scenarios.length > 0) {
                result.currentScenarioId = result.scenarios[0].id || 'default';
              }
              
              // Ensure master data exists
              if (!result.departments || !Array.isArray(result.departments)) {
                result.departments = ['Sales', 'Production Planning', 'Material Planning', 'Material Handling', 'Purchase', 'Production Execution', 'Parts Quality', 'Vehicle Quality', 'Finance', 'Trade & Compliance'];
              }
              
              if (!result.sysNameList || !Array.isArray(result.sysNameList)) {
                result.sysNameList = ['SAP', 'LES', 'MES', 'KAPTURE', 'WMS', 'To Be Determined'];
              }
              
              if (!result.businessStatuses || !Array.isArray(result.businessStatuses)) {
                result.businessStatuses = [
                  { value: 'Not Defined', color: 'red' },
                  { value: 'In Progress', color: 'yellow' },
                  { value: 'Completed', color: 'green' }
                ];
              }
              
              if (!result.sysStatusList || !Array.isArray(result.sysStatusList)) {
                result.sysStatusList = [
                  { value: 'Operational', color: 'green' },
                  { value: 'Completed', color: 'green' },
                  { value: 'Offline', color: 'red' },
                  { value: 'To Be Implemented', color: 'red' },
                  { value: 'Work in Progress', color: 'yellow' }
                ];
              }
              
              if (!result.sysRespList || !Array.isArray(result.sysRespList)) {
                result.sysRespList = [];
              }
              
              fs.writeFileSync('data.json', JSON.stringify(result, null, 2));
              console.log('data.json updated successfully');
              console.log('Final scenarios count:', result.scenarios.length);
              console.log('Final currentScenarioId:', result.currentScenarioId);
              return true;
            }
            
            // ============================================================
            // FUNCTION: Manual merge (fallback when jsondiffpatch fails)
            // ============================================================
            function manualMerge(target, diff) {
              console.log('Performing manual merge...');
              const result = JSON.parse(JSON.stringify(target));
              
              // Handle scenarios
              if (diff.scenarios) {
                console.log('Processing scenarios...');
                if (diff.scenarios._t === 'a') {
                  // Array diff
                  result.scenarios = mergeArrayDiff(result.scenarios || [], diff.scenarios);
                } else if (Array.isArray(diff.scenarios)) {
                  // Full array replacement/merge
                  for (const newScenario of diff.scenarios) {
                    if (!newScenario || typeof newScenario !== 'object') continue;
                    const existingIndex = result.scenarios.findIndex(s => 
                      s && (s.id === newScenario.id || s.name === newScenario.name)
                    );
                    if (existingIndex >= 0) {
                      result.scenarios[existingIndex] = { ...result.scenarios[existingIndex], ...newScenario };
                    } else {
                      result.scenarios.push(newScenario);
                    }
                  }
                } else if (typeof diff.scenarios === 'object') {
                  // Object with numeric keys
                  const keys = Object.keys(diff.scenarios).filter(k => k !== '_t');
                  for (const key of keys) {
                    const value = diff.scenarios[key];
                    if (key.startsWith('_')) {
                      const index = parseInt(key.substring(1));
                      if (!isNaN(index) && Array.isArray(value) && value.length === 2 && value[1] === 0) {
                        // Removal
                        if (index < result.scenarios.length) {
                          result.scenarios.splice(index, 1);
                          console.log('Removed scenario at index:', index);
                        }
                      } else if (!isNaN(index) && value && typeof value === 'object') {
                        // Update scenario
                        if (index < result.scenarios.length && result.scenarios[index]) {
                          result.scenarios[index] = manualMerge(result.scenarios[index], value);
                          console.log('Updated scenario at index:', index);
                        }
                      }
                    } else {
                      const index = parseInt(key);
                      if (!isNaN(index)) {
                        if (Array.isArray(value) && value.length === 1) {
                          // New scenario
                          const newScenario = value[0];
                          if (newScenario && typeof newScenario === 'object') {
                            if (index < result.scenarios.length) {
                              result.scenarios[index] = { ...result.scenarios[index], ...newScenario };
                            } else {
                              result.scenarios.push(newScenario);
                            }
                          }
                        } else if (value && typeof value === 'object') {
                          if (index < result.scenarios.length) {
                            result.scenarios[index] = { ...result.scenarios[index], ...value };
                          } else {
                            result.scenarios.push(value);
                          }
                        }
                      }
                    }
                  }
                }
              }
              
              // Handle other top-level keys
              for (const key in diff) {
                if (key === '_t' || key === 'scenarios') continue;
                if (Array.isArray(diff[key]) && diff[key].length === 1) {
                  result[key] = diff[key][0];
                } else if (diff[key] && typeof diff[key] === 'object' && !Array.isArray(diff[key])) {
                  result[key] = manualMerge(result[key] || {}, diff[key]);
                } else {
                  result[key] = diff[key];
                }
              }
              
              return result;
            }
            
            // ============================================================
            // FUNCTION: Merge array diff
            // ============================================================
            function mergeArrayDiff(currentArray, diff) {
              const result = [...currentArray];
              const removals = [];
              const updates = [];
              const insertions = [];
              
              for (const key in diff) {
                if (key === '_t') continue;
                const value = diff[key];
                
                if (key.startsWith('_')) {
                  const index = parseInt(key.substring(1));
                  if (isNaN(index)) continue;
                  
                  if (Array.isArray(value) && value.length === 2 && value[1] === 0) {
                    removals.push(index);
                  } else if (Array.isArray(value) && value.length === 3 && value[2] === 0) {
                    updates.push({ index: index, value: value[0] });
                  } else if (value && typeof value === 'object' && !Array.isArray(value)) {
                    // Nested diff
                    if (index < result.length && result[index]) {
                      result[index] = manualMerge(result[index], value);
                    }
                  }
                } else {
                  const index = parseInt(key);
                  if (!isNaN(index) && Array.isArray(value) && value.length === 1) {
                    insertions.push({ index: index, value: value[0] });
                  }
                }
              }
              
              // Apply removals (highest to lowest)
              removals.sort((a, b) => b - a);
              for (const idx of removals) {
                if (idx < result.length) {
                  result.splice(idx, 1);
                  console.log('Array diff: removed at index:', idx);
                }
              }
              
              // Apply updates
              for (const update of updates) {
                if (update.index < result.length) {
                  result[update.index] = update.value;
                  console.log('Array diff: updated at index:', update.index);
                }
              }
              
              // Apply insertions (highest to lowest)
              insertions.sort((a, b) => b.index - a.index);
              for (const ins of insertions) {
                if (ins.index < result.length) {
                  result.splice(ins.index, 0, ins.value);
                  console.log('Array diff: inserted at index:', ins.index);
                } else {
                  result.push(ins.value);
                  console.log('Array diff: appended');
                }
              }
              
              return result;
            }
            
            // ============================================================
            // FUNCTION: Process Gist
            // ============================================================
            function processGist(gistId) {
              console.log('Fetching diff from Gist:', gistId);
              const token = process.env.GITHUB_TOKEN;
              if (!token) {
                console.error('GITHUB_TOKEN not found');
                process.exit(1);
              }
              
              const gistUrl = 'https://api.github.com/gists/' + gistId;
              
              fetch(gistUrl, {
                headers: {
                  'Authorization': 'token ' + token,
                  'Accept': 'application/vnd.github.v3+json'
                }
              })
              .then(function(response) {
                if (!response.ok) {
                  throw new Error('Gist API returned ' + response.status);
                }
                return response.json();
              })
              .then(function(gistData) {
                const files = gistData.files;
                const fileNames = Object.keys(files);
                if (fileNames.length === 0) {
                  throw new Error('No files in gist');
                }
                const fileContent = files[fileNames[0]].content;
                console.log('Gist file content length:', fileContent.length);
                
                try {
                  diffData = JSON.parse(fileContent);
                  console.log('Diff parsed from Gist successfully');
                  applyDiffToData();
                } catch (e) {
                  console.error('Failed to parse Gist content:', e.message);
                  process.exit(1);
                }
                
                return fetch('https://api.github.com/gists/' + gistId, {
                  method: 'DELETE',
                  headers: { 'Authorization': 'token ' + token }
                });
              })
              .then(function() {
                console.log('Gist deleted');
              })
              .catch(function(e) {
                console.error('Gist processing failed:', e.message);
                process.exit(1);
              });
            }
            
            // ============================================================
            // MAIN EXECUTION
            // ============================================================
            if (payloadType === 'gist' && payload.gist_id) {
              processGist(payload.gist_id);
              setTimeout(function() {}, 30000);
            } else {
              console.log('Processing direct payload...');
              let payloadData = payload.data || '';
              console.log('Payload data length:', payloadData.length);
              
              if (payloadData && payloadData.length > 0) {
                try {
                  diffData = JSON.parse(payloadData);
                  console.log('Direct diff parsed successfully');
                  console.log('Diff data keys:', Object.keys(diffData));
                  applyDiffToData();
                } catch (e) {
                  console.error('Failed to parse payload data:', e.message);
                  console.log('Payload data preview:', payloadData.substring(0, 200));
                  process.exit(1);
                }
              } else {
                console.error('No data found in payload');
                process.exit(1);
              }
            }
          "

      - name: Validate JSON
        run: |
          if [ -f data.json ] && [ -s data.json ]; then
            if ! jq empty data.json 2>/dev/null; then
              echo "Invalid JSON in data.json"
              cat data.json | head -100
              exit 1
            fi
            echo "JSON validation passed"
          fi

      - name: Commit and push
        run: |
          if [ -f data.json ] && git diff --quiet data.json; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config.user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Apply changes from web [skip ci]" || echo "No changes to commit"
            git push
          fi
