name: Update data.json from web

on:
  repository_dispatch:
    types: [update-data]

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install jsondiffpatch
        run: npm install jsondiffpatch

      - name: Write payload to file
        run: |
          cat > payload.json << 'EOF'
          ${{ toJSON(github.event.client_payload) }}
          EOF

      - name: Apply diff
        run: |
          node -e "
            const fs = require('fs');
            const jsondiffpatch = require('jsondiffpatch');
            
            console.log('=== Starting diff application ===');
            
            // Read current data.json
            let currentData = {};
            try {
              const content = fs.readFileSync('data.json', 'utf8');
              currentData = JSON.parse(content);
              console.log('Current data loaded, scenarios:', currentData.scenarios?.length || 0);
            } catch (e) {
              console.log('No existing data.json, creating new one');
            }
            
            // Read payload
            const payloadContent = fs.readFileSync('payload.json', 'utf8');
            let payload;
            try {
              payload = JSON.parse(payloadContent);
              console.log('Payload parsed successfully');
              console.log('Payload keys:', Object.keys(payload));
            } catch (e) {
              console.error('Failed to parse payload.json:', e.message);
              process.exit(1);
            }
            
            let diffData = null;
            const payloadType = payload.type || 'diff';
            
            // Handle Gist payload (large data)
            if (payloadType === 'gist' && payload.gist_id) {
              console.log('Fetching diff from Gist:', payload.gist_id);
              const token = process.env.GITHUB_TOKEN;
              if (!token) {
                console.error('GITHUB_TOKEN not found');
                process.exit(1);
              }
              
              const gistUrl = 'https://api.github.com/gists/' + payload.gist_id;
              
              fetch(gistUrl, {
                headers: {
                  'Authorization': 'token ' + token,
                  'Accept': 'application/vnd.github.v3+json'
                }
              })
              .then(response => {
                if (!response.ok) throw new Error('Gist API returned ' + response.status);
                return response.json();
              })
              .then(gistData => {
                const files = gistData.files;
                const fileNames = Object.keys(files);
                if (fileNames.length === 0) throw new Error('No files in gist');
                const fileContent = files[fileNames[0]].content;
                diffData = JSON.parse(fileContent);
                console.log('Gist diff parsed successfully');
                applyDiffToData();
                
                // Delete the gist
                return fetch('https://api.github.com/gists/' + payload.gist_id, {
                  method: 'DELETE',
                  headers: { 'Authorization': 'token ' + token }
                });
              })
              .then(() => console.log('Gist deleted'))
              .catch(e => {
                console.error('Gist processing failed:', e.message);
                process.exit(1);
              });
              
              setTimeout(() => {}, 30000);
              return;
            }
            
            // Handle direct diff payload
            if (payload.data && payload.data.length > 0) {
              try {
                diffData = JSON.parse(payload.data);
                console.log('Direct diff parsed successfully');
                applyDiffToData();
              } catch (e) {
                console.error('Failed to parse payload data:', e.message);
                process.exit(1);
              }
            } else {
              console.error('No data found in payload');
              process.exit(1);
            }
            
            function applyDiffToData() {
              if (!diffData) {
                console.error('No diff data to apply');
                process.exit(1);
              }
              
              console.log('Applying diff to current data...');
              try {
                // Use jsondiffpatch to apply the diff
                const patchedData = jsondiffpatch.patch(currentData, diffData);
                console.log('Diff applied successfully');
                
                // Validate the patched data
                if (!patchedData.scenarios || !Array.isArray(patchedData.scenarios)) {
                  console.error('Invalid data after patching: scenarios is not an array');
                  process.exit(1);
                }
                
                // Ensure currentScenarioId is a string
                if (Array.isArray(patchedData.currentScenarioId)) {
                  patchedData.currentScenarioId = patchedData.currentScenarioId[0] || 'default';
                }
                
                // Write the updated data
                fs.writeFileSync('data.json', JSON.stringify(patchedData, null, 2));
                console.log('data.json updated successfully');
                console.log('Final scenarios count:', patchedData.scenarios.length);
                console.log('Final currentScenarioId:', patchedData.currentScenarioId);
              } catch (e) {
                console.error('Failed to apply diff:', e.message);
                process.exit(1);
              }
            }
          "

      - name: Validate JSON
        run: |
          if [ -f data.json ] && [ -s data.json ]; then
            if ! jq empty data.json 2>/dev/null; then
              echo "Invalid JSON in data.json"
              cat data.json | head -100
              exit 1
            fi
            echo "JSON validation passed"
          fi

      - name: Commit and push
        run: |
          if [ -f data.json ] && git diff --quiet data.json; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config.user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Apply changes from web [skip ci]" || echo "No changes to commit"
            git push
          fi
