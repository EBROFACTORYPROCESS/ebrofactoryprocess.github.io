name: Update data.json from web

on:
  repository_dispatch:
    types: [update-data]

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install jsondiffpatch
        run: npm install jsondiffpatch@0.4.1

      - name: Write payload to file
        run: |
          cat > payload.json << 'EOF'
          ${{ toJSON(github.event.client_payload) }}
          EOF

      - name: Apply changes
        run: |
          node -e '
            const fs = require("fs");
            const jsondiffpatch = require("jsondiffpatch");

            console.log("=== Applying changes ===");

            let currentData = {};
            try {
              currentData = JSON.parse(fs.readFileSync("data.json", "utf8"));
              console.log("Current data loaded, scenarios:", currentData.scenarios?.length || 0);
            } catch (e) {
              console.log("No existing data.json, starting fresh");
            }

            const payload = JSON.parse(fs.readFileSync("payload.json", "utf8"));
            console.log("Payload type:", payload.type);

            let result = JSON.parse(JSON.stringify(currentData));

            if (payload.type === "node-diff" && payload.data) {
              const diff = JSON.parse(payload.data);
              console.log("Applying node-diff by ID");
              for (const scId in diff) {
                const scenarioDiff = diff[scId];

                // ==========================================================
                // Handle SCENARIO DELETION
                // ==========================================================
                if (scenarioDiff._deleted) {
                  const idx = result.scenarios.findIndex(s => s.id === scId);
                  if (idx !== -1) {
                    result.scenarios.splice(idx, 1);
                    console.log(`Deleted scenario: ${scId}`);
                  } else {
                    console.warn(`Scenario ${scId} not found for deletion`);
                  }
                  continue;
                }

                // ==========================================================
                // Handle NEW SCENARIO (full data)
                // ==========================================================
                if (scenarioDiff._full) {
                  const newScenario = scenarioDiff.data;
                  if (!result.scenarios.some(s => s.id === newScenario.id)) {
                    result.scenarios.push(newScenario);
                    console.log(`Added new scenario: ${newScenario.id} (${newScenario.name})`);
                  } else {
                    const idx = result.scenarios.findIndex(s => s.id === newScenario.id);
                    if (idx !== -1) {
                      result.scenarios[idx] = newScenario;
                      console.log(`Updated scenario ${newScenario.id} with full data`);
                    }
                  }
                  continue;
                }

                let scenario = result.scenarios.find(s => s.id === scId);
                if (!scenario) {
                  console.warn("Scenario not found:", scId);
                  continue;
                }
                // ============================================================
                // Apply master data changes (ADDED)
                // ============================================================
                if (diff._master) {
                    const masterChanges = diff._master;
                    for (const key in masterChanges) {
                        const change = masterChanges[key];
                        if (change._added) {
                            if (!result[key]) result[key] = [];
                            change._added.forEach(item => {
                                // Check if item already exists (avoid duplicates)
                                const exists = result[key].some(existing => JSON.stringify(existing) === JSON.stringify(item));
                                if (!exists) {
                                    result[key].push(item);
                                    console.log(`Added to ${key}:`, item);
                                }
                            });
                        }
                        if (change._removed) {
                            if (result[key]) {
                                change._removed.forEach(item => {
                                    const idx = result[key].findIndex(existing => JSON.stringify(existing) === JSON.stringify(item));
                                    if (idx !== -1) {
                                        result[key].splice(idx, 1);
                                        console.log(`Removed from ${key}:`, item);
                                    }
                                });
                            }
                        }
                        if (change._updated) {
                            result[key] = change._updated;
                            console.log(`Updated ${key}`);
                        }
                    }
                }
                // ==========================================================
                // Apply scenario-level changes (name, etc.)
                // ==========================================================
                if (scenarioDiff._scenario) {
                  for (const key in scenarioDiff._scenario) {
                    scenario[key] = scenarioDiff._scenario[key];
                    console.log(`Updated scenario ${scId}: ${key} = ${scenarioDiff._scenario[key]}`);
                  }
                }

                if (!scenario.workflow) scenario.workflow = { nodes: [], connections: [] };
                const nodes = scenario.workflow.nodes || [];
                const connections = scenario.workflow.connections || [];

                // Apply process changes
                if (scenarioDiff.processes) {
                  const procDiffs = scenarioDiff.processes;
                  const processes = scenario.processes || [];
                  for (const procId in procDiffs) {
                    const change = procDiffs[procId];
                    if (change._deleted) {
                      const idx = processes.findIndex(p => p.id === procId);
                      if (idx !== -1) {
                        processes.splice(idx, 1);
                        console.log(`Deleted process ${procId}`);
                      }
                    } else if (change._added) {
                      const newProc = change.proc;
                      if (!newProc.id) newProc.id = procId;
                      if (!processes.some(p => p.id === procId)) {
                        processes.push(newProc);
                        console.log(`Added process ${procId}`);
                      }
                    } else if (change._updated) {
                      const idx = processes.findIndex(p => p.id === procId);
                      if (idx !== -1) {
                        processes[idx] = change.proc;
                        console.log(`Updated process ${procId}`);
                      }
                    }
                  }
                  scenario.processes = processes;
                }

                // Apply node changes
                if (scenarioDiff.nodes) {
                  for (const nodeId in scenarioDiff.nodes) {
                    const change = scenarioDiff.nodes[nodeId];
                    if (change._deleted) {
                      const idx = nodes.findIndex(n => n.id === nodeId);
                      if (idx !== -1) {
                        nodes.splice(idx, 1);
                        console.log(`Deleted node ${nodeId}`);
                      }
                    } else if (change._added) {
                      const newNode = change.node;
                      if (!newNode.id) newNode.id = nodeId;
                      if (!nodes.some(n => n.id === nodeId)) {
                        nodes.push(newNode);
                        console.log(`Added node ${nodeId}`);
                      }
                    } else {
                      const node = nodes.find(n => n.id === nodeId);
                      if (node) {
                        for (const key in change) {
                          node[key] = change[key];
                        }
                        console.log(`Updated node ${nodeId}`);
                      }
                    }
                  }
                }

                // Apply connection changes
                if (scenarioDiff.connections) {
                  const connDiffs = scenarioDiff.connections;
                  for (const connId in connDiffs) {
                    const change = connDiffs[connId];
                    if (change._deleted) {
                      const idx = connections.findIndex(c => c.id === connId);
                      if (idx !== -1) {
                        connections.splice(idx, 1);
                        console.log(`Deleted connection ${connId}`);
                      }
                    } else if (change._added) {
                      const newConn = change.conn;
                      if (!newConn.id) newConn.id = connId;
                      if (!connections.some(c => c.id === connId)) {
                        connections.push(newConn);
                        console.log(`Added connection ${connId}`);
                      }
                    } else {
                      const conn = connections.find(c => c.id === connId);
                      if (conn) {
                        for (const key in change) {
                          conn[key] = change[key];
                        }
                        console.log(`Updated connection ${connId}`);
                      }
                    }
                  }
                }
              }
              fs.writeFileSync("data.json", JSON.stringify(result, null, 2));
              console.log("✅ Node-diff applied successfully");

            } else if (payload.type === "diff" && payload.data) {
              const diff = JSON.parse(payload.data);
              result = jsondiffpatch.patch(currentData, diff);
              fs.writeFileSync("data.json", JSON.stringify(result, null, 2));
              console.log("✅ Patch applied successfully");

            } else if (payload.type === "gist" && payload.gist_id) {
              console.log("Gist mode not implemented in this version, falling back to diff");
              if (payload.data) {
                const diff = JSON.parse(payload.data);
                result = jsondiffpatch.patch(currentData, diff);
                fs.writeFileSync("data.json", JSON.stringify(result, null, 2));
                console.log("✅ Patch applied (from gist data)");
              } else {
                console.log("⚠️ No data in gist payload");
              }

            } else if (payload.type === "full" && payload.data) {
              const newData = JSON.parse(payload.data);
              fs.writeFileSync("data.json", JSON.stringify(newData, null, 2));
              console.log("✅ Full data written");

            } else {
              console.log("⚠️ No valid data to apply");
              process.exit(1);
            }

            console.log("✅ Apply changes completed");
          '

      - name: Validate JSON
        run: |
          if [ -f data.json ] && [ -s data.json ]; then
            if ! jq empty data.json 2>/dev/null; then
              echo "❌ Invalid JSON in data.json"
              cat data.json | head -100
              exit 1
            fi
            echo "✅ JSON validation passed"
          else
            echo "⚠️ data.json missing or empty"
            exit 1
          fi

      - name: Commit and push
        run: |
          if [ -f data.json ] && git diff --quiet data.json; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Apply changes from web [skip ci]" || echo "No changes to commit"
            git push --no-verify origin HEAD:main || git push --force origin HEAD:main
          fi
